version: '3.8'

networks:
  csm-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local

services:
  # ==========================================
  # 1. DATABASE (Multi-schema MySQL Container)
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: csm-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infrastructure/docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - csm-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ==========================================
  # 2. AUTH SERVICE (Port 3001)
  # ==========================================
  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    container_name: csm-auth-service
    restart: always
    environment:
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-development}
      DB_SYNC: ${DB_SYNC:-true}
      AUTH_DB_URL: mysql://root:${DB_PASSWORD:-rootpassword}@mysql:3306/csm_auth
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-access-token-key-32chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super-secret-jwt-refresh-token-key-32chars}
    ports:
      - "3001:3001"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - csm-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/auth/health', (r) => {process.exit(r.statusCode < 500 ? 0 : 1)}).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ==========================================
  # 3. PRODUCT SERVICE (Port 3002)
  # ==========================================
  product-service:
    build:
      context: .
      dockerfile: apps/product-service/Dockerfile
    container_name: csm-product-service
    restart: always
    environment:
      PORT: 3002
      NODE_ENV: ${NODE_ENV:-development}
      DB_SYNC: ${DB_SYNC:-true}
      PRODUCT_DB_URL: mysql://root:${DB_PASSWORD:-rootpassword}@mysql:3306/csm_product
    ports:
      - "3002:3002"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - csm-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health', (r) => {process.exit(r.statusCode < 500 ? 0 : 1)}).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ==========================================
  # 4. INVENTORY SERVICE (Port 3003)
  # ==========================================
  inventory-service:
    build:
      context: .
      dockerfile: apps/inventory-service/Dockerfile
    container_name: csm-inventory-service
    restart: always
    environment:
      PORT: 3003
      NODE_ENV: ${NODE_ENV:-development}
      DB_SYNC: ${DB_SYNC:-true}
      INVENTORY_DB_URL: mysql://root:${DB_PASSWORD:-rootpassword}@mysql:3306/csm_inventory
      ORDER_SERVICE_URL: http://order-service:3004
      INTERNAL_SECRET: ${INTERNAL_SECRET:-csm-super-secure-internal-secret-token}
    ports:
      - "3003:3003"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - csm-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3003/inventory/health', (r) => {process.exit(r.statusCode < 500 ? 0 : 1)}).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ==========================================
  # 5. ORDER SERVICE (Port 3004)
  # ==========================================
  order-service:
    build:
      context: .
      dockerfile: apps/order-service/Dockerfile
    container_name: csm-order-service
    restart: always
    environment:
      PORT: 3004
      NODE_ENV: ${NODE_ENV:-development}
      DB_SYNC: ${DB_SYNC:-true}
      ORDER_DB_URL: mysql://root:${DB_PASSWORD:-rootpassword}@mysql:3306/csm_order
      INVENTORY_SERVICE_URL: http://inventory-service:3003
      PRODUCT_SERVICE_URL: http://product-service:3002
      PAYMENT_SERVICE_URL: http://payment-service:3005
      NOTIFICATION_SERVICE_URL: http://notification-service:3006
      INTERNAL_SECRET: ${INTERNAL_SECRET:-csm-super-secure-internal-secret-token}
    ports:
      - "3004:3004"
    depends_on:
      mysql:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
    networks:
      - csm-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3004/orders/health', (r) => {process.exit(r.statusCode < 500 ? 0 : 1)}).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ==========================================
  # 6. PAYMENT SERVICE (Port 3005)
  # ==========================================
  payment-service:
    build:
      context: .
      dockerfile: apps/payment-service/Dockerfile
    container_name: csm-payment-service
    restart: always
    environment:
      PORT: 3005
    ports:
      - "3005:3005"
    networks:
      - csm-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3005/payments/health', (r) => {process.exit(r.statusCode < 500 ? 0 : 1)}).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # 7. NOTIFICATION SERVICE (Port 3006 - Mô phỏng)
  # ==========================================
  notification-service:
    build:
      context: .
      dockerfile: apps/notification-service/Dockerfile
    container_name: csm-notification-service
    restart: always
    environment:
      PORT: 3006
    ports:
      - "3006:3006"
    networks:
      - csm-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3006/notifications/health', (r) => {process.exit(r.statusCode < 500 ? 0 : 1)}).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # 8. API GATEWAY (Port 8000)
  # ==========================================
  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: csm-api-gateway
    restart: always
    environment:
      PORT: 8000
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-access-token-key-32chars}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-csm-super-secure-internal-secret-token}
      AUTH_SERVICE_URL: http://auth-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      INVENTORY_SERVICE_URL: http://inventory-service:3003
      ORDER_SERVICE_URL: http://order-service:3004
      PAYMENT_SERVICE_URL: http://payment-service:3005
      NOTIFICATION_SERVICE_URL: http://notification-service:3006
    ports:
      - "8000:8000"
    depends_on:
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    networks:
      - csm-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/api/v1/health', (r) => {process.exit(r.statusCode < 500 ? 0 : 1)}).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ==========================================
  # 9. FRONTEND (React + Vite + Nginx - Port 3000)
  # ==========================================
  frontend:
    build:
      context: ../CSM-FE
      dockerfile: Dockerfile
    container_name: csm-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - csm-network
